# Блокировка простых ботов по User-Agent
map $http_user_agent $limit_bots {
    default 0;
    ~*(curl|python|perl|urllib|bot|crawler|scan) 1;
}

# Sticky-cookie: если передан ?route=NAME, формируем Set-Cookie (Angie ставит cookie)
map $arg_route $sticky_cookie {
    default "";
    ~.+ "srv_id=$arg_route; Path=/; Max-Age=3600; Domain=158.160.79.161; Secure; HttpOnly; SameSite=Lax";
}

# Значение cookie -> имя backend (для читаемости/логики)
map $cookie_srv_id $backend_key {
    default "";
    white white;
    green green;
    gold gold;
}

# Приоритет 1: если в URL есть ?route=NAME -> конкретный адрес
map $arg_route $upstream_from_arg {
    default "";
    white "127.0.0.1:5001";
    green "127.0.0.1:5002";
    gold  "127.0.0.1:5003";
}

# Приоритет 2: если есть cookie srv_id -> конкретный адрес
map $cookie_srv_id $upstream_from_cookie {
    default "";
    white "127.0.0.1:5001";
    green "127.0.0.1:5002";
    gold  "127.0.0.1:5003";
}

# Выбираем target: если есть upstream_from_arg — используем его, иначе используем upstream_from_cookie
map $upstream_from_arg $target_upstream {
    default $upstream_from_cookie;
    ~.+     $upstream_from_arg;
}

# Upstream пул (fallback round-robin)
upstream color_backends {
    server 127.0.0.1:5001 weight=1; # white
    server 127.0.0.1:5002 weight=1; # green
    server 127.0.0.1:5003 weight=1; # gold
}

# HTTP -> HTTPS редирект (по IP)
server {
    listen 80;
    server_name 158.160.79.161;
    return 301 https://158.160.79.161$request_uri;
}

# HTTPS vhost для color-cluster
server {
    listen 443 ssl;
    server_name 158.160.79.161;
    # http2 отключён для стабильности

    ssl_certificate     /etc/angie/ssl/selfsigned.crt;
    ssl_certificate_key /etc/angie/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # Быстрая отбраковка ботов
    if ($limit_bots = 1) {
        return 444;
    }

    # Применяем глобальные зоны (limit_req_zone и limit_conn_zone вынесены в angie.conf)
    limit_req  zone=req_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    # Минимальные security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    keepalive_timeout 65;

    location / {
        # Добавляем Set-Cookie (map формирует строку с Domain/Secure/HttpOnly/SameSite).
        # Если $sticky_cookie пустая строка, заголовок не будет добавлен.
        add_header Set-Cookie $sticky_cookie always;

        # Вычисляем target: если $target_upstream непустой — проксируем на конкретный адрес,
        # иначе — на пул color_backends.
        set $target "";
        if ($target_upstream != "") {
            set $target "http://$target_upstream";
        }

        if ($target = "") {
            proxy_pass http://color_backends;
        }
        if ($target != "") {
            proxy_pass $target;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Используем глобальную зону backend_cache (в angie.conf) при необходимости
        #proxy_cache backend_cache;
        #proxy_cache_key $scheme$host$request_uri;
        #proxy_cache_valid 200 1m;
        #proxy_cache_use_stale error timeout http_502 http_503 http_504;
    }

    # Статика — отдавать с долгим TTL
    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|gif|jpg|jpeg|png|webp|avif)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://color_backends;
        proxy_set_header Host $host;
    }
}

