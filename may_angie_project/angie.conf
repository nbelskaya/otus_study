user  angie;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/angie/error.log notice;
pid        /run/angie.pid;

events {
    worker_connections  65536;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    # Формат логов
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    log_format extended '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" rt="$request_time" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'h="$host" sn="$server_name" ru="$request_uri" u="$uri" '
                        'ucs="$upstream_cache_status" ua="$upstream_addr" us="$upstream_status" '
                        'uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # proxy_cache_path вынесен в глобальный конфиг
    # зона кеша для backend'ов
    proxy_cache_path /var/cache/angie levels=1:2 keys_zone=backend_cache:10m max_size=100m inactive=10m use_temp_path=off;

    # Gzip включён глобально — экономит место в vhost и единообразно сжимает ответы
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;

    # DoS зоны вынесены в глобальный конфиг — одна зона на весь сервер
    # ограничение частоты запросов по IP
    limit_req_zone  $binary_remote_addr zone=req_limit:10m rate=5r/s;
    # ограничение одновременных подключений по IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    log_format color_log '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'upstream="$upstream_addr" upstream_status="$upstream_status" '
                         'upstream_time="$upstream_response_time" backend="$upstream_http_x_backend_name"';

    access_log /var/log/angie/access.log color_log;

    include /etc/angie/http.d/*.conf;
}

