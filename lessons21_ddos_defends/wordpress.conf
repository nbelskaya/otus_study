# Зоны защиты от DoS
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=5r/s;   # ограничение частоты
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;           # ограничение подключений

# Блокировка простых ботов
map $http_user_agent $limit_bots {
    default 0;
    ~*(curl|python|perl|urllib|bot|crawler|scan) 1;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name 46.21.247.233 wordpress.local;
    return 301 https://46.21.247.233$request_uri;
}

# Основной сервер WordPress
server {
    listen 443 ssl;
    http2 on;

    server_name 46.21.247.233 wordpress.local;

    ssl_certificate      /etc/angie/ssl/wordpress.pem;
    ssl_certificate_key  /etc/angie/ssl/wordpress.key;

    # Базовая безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/angie/wordpress_access.log;
    error_log  /var/log/angie/wordpress_error.log;

    # Защита скрытых файлов
    location ~ /\. {
        deny all;
    }

    # Запрет кеша WordPress
    location ~ ^/wp-content/cache {
        deny all;
    }

    # Запрет выполнения PHP в uploads
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Точка атаки 2 — xmlrpc.php , закрываем
    location = /xmlrpc.php {
        deny all;
    }

    # Точка атаки 1 — wp-login.php
    # Ограничение частоты + подключений
    location = /wp-login.php {
        limit_req zone=req_limit burst=10 nodelay;
        limit_conn conn_limit 2;
        proxy_pass http://127.0.0.1:8080;
    }

    # Точка атаки 3 — wp-admin/
    # Ограничение по IP + basic-auth
    location /wp-admin/ {
        satisfy all;

        allow 188.242.98.168;   # IP виртуалки YaCloud
        deny all;

        auth_basic "Restricted";
        auth_basic_user_file /etc/angie/htpasswd;

        proxy_pass http://127.0.0.1:8080;
    }

    # Блокировка ботов по User-Agent
    if ($limit_bots = 1) {
        return 444;
    }

    # Основной роутинг WordPress
    location / {
        limit_req zone=req_limit burst=20 nodelay;   # защита wp-json и др.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------
    # Кэширование статики
    # ----------------------------
    location ~* \.(css|gif|ico|jpeg|jpg|js|png|svg|woff2?)$ {
        access_log off;
        add_header Cache-Control "max-age=31536000, public, immutable";
        proxy_pass http://127.0.0.1:8080;
    }
}

